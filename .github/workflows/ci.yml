name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Headless Chromium for the --browser (color-contrast) tests. Only the
      # headless shell is needed, plus its Linux system libraries.
      - run: npx playwright install --with-deps --only-shell chromium

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test
        env:
          # Fail, rather than skip, the browser tests if Chromium is missing.
          A11Y_AUTOFIX_REQUIRE_BROWSER: '1'
